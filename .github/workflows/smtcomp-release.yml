name: SMT-COMP Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3 make

      - name: Clone and Build Upstream Z3
        run: |
          git clone --depth 1 https://github.com/Z3Prover/z3.git z3-upstream
          cd z3-upstream
          python3 scripts/mk_make.py --staticbin
          cd build
          make -j$(nproc)
          cd ../..

      - name: Configure and Build BooledASS
        run: |
          python3 scripts/mk_make.py --staticbin
          cd build
          make -j$(nproc)

      - name: Package Release
        run: |
          cp build/z3 ./z3-BooledASS
          cp z3-upstream/build/z3 ./z3
          tar -czf z3-BooledASS.tar.gz z3-BooledASS z3 src scripts CMakeLists.txt LICENSE.txt README.md configure RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete tag and release if they exist to allow clean overwrites/updates
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          git push origin :refs/tags/v1.0.0 || true
          
          # Create new release and upload binary
          gh release create v1.0.0 z3-BooledASS.tar.gz --title "BooledASS v1.0.0" --notes "Official compiled binary of BooledASS for SMT-COMP 2026."
